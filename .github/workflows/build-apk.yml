name: Build Android APK (AniPulse VIP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build AniPulse VIP Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM dependencies
        run: npm ci

      - name: ⚡ Build Vite Web Application
        run: npm run build

      - name: 📱 Copy Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: 🔧 Set Gradle wrapper permissions
        run: chmod +x ./android/gradlew

      - name: 🔨 Compile Android Debug APK
        run: |
          cd android
          if ! ./gradlew :app:assembleDebug --stacktrace --no-daemon > gradle_build.log 2>&1; then
            echo "::error::Gradle assembleDebug build failed!"
            grep -iE 'FAILURE:|BUILD FAILED|Caused by:|what went wrong|cannot find symbol|package .* does not exist' gradle_build.log | head -n 15 | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat gradle_build.log
            exit 1
          fi
          echo "=== ANDROID BUILD DIRECTORY CONTENTS ==="
          find app/build -type f | head -n 30 || true

      - name: 🏷️ Prepare APK for Download
        run: |
          mkdir -p build-output
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          if [ -n "$APK_FILE" ]; then
            cp -v "$APK_FILE" build-output/AniPulse-VIP-v1.0.apk
            ls -lh build-output/
          else
            echo "::error::No APK file found in android directory!"
            find android -maxdepth 4 -type d
            exit 1
          fi

      - name: 🚀 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AniPulse-VIP-Android-APK
          path: build-output/AniPulse-VIP-v1.0.apk
          if-no-files-found: error
          retention-days: 30
