name: Build Android APK (AniPulse VIP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build AniPulse VIP Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM dependencies
        run: npm ci

      - name: ⚡ Build Vite Web Application
        run: npm run build

      - name: 📱 Copy Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: 🔧 Set Gradle wrapper permissions
        run: chmod +x ./android/gradlew

      - name: 🔨 Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log || {
            echo "::error::Gradle assembleDebug failed!"
            echo "=== GRADLE FAILURE LOG START ==="
            grep -E 'FAILURE:|BUILD FAILED|Caused by:|what went wrong' ../build.log -A 10 || tail -n 60 ../build.log
            echo "=== GRADLE FAILURE LOG END ==="
            exit 1
          }

      - name: 🏷️ Prepare APK for Download
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniPulse-VIP-v1.0.apk
          ls -la build-output/

      - name: 🚀 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AniPulse-VIP-Android-APK
          path: build-output/AniPulse-VIP-v1.0.apk
          if-no-files-found: error
          retention-days: 30
