name: Build Android APK (AniPulse VIP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build AniPulse VIP Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM dependencies
        run: npm ci

      - name: ⚡ Build Vite Web Application
        run: npm run build

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📜 Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: 🔧 Set Gradle wrapper permissions
        run: chmod +x ./android/gradlew

      - name: 📱 Sync Capacitor Android Web Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          ./node_modules/.bin/cap copy android || npx @capacitor/cli copy android || true

      - name: 🔨 Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🏷️ Prepare APK for Download
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniPulse-VIP-v1.0.apk
          ls -la build-output/

      - name: 🚀 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AniPulse-VIP-Android-APK
          path: build-output/AniPulse-VIP-v1.0.apk
          if-no-files-found: error
          retention-days: 30
